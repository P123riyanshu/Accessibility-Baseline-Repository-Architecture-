[build]
command = "npm run build --workspace @service/client"
publish = "client/dist"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "20"

[[redirects]]
from = "/api/health"
to = "/.netlify/functions/api-health"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
